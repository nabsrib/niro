<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Niro</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f2f2f2" />
    <!-- Splash styles live here (not in styles.css) so they apply before the app's CSS loads. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f2f2f2;
        transition: opacity 0.35s ease;
      }
      #splash.splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash__logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      /* The mark pops in, then breathes gently while loading. */
      .splash__mark {
        width: 96px;
        height: 96px;
        animation:
          splash-in 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both,
          splash-breathe 1.6s ease-in-out 0.6s infinite;
      }
      .splash__name {
        font-family: 'Nunito', 'Varela Round', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #1f3a5f;
        animation: splash-rise 0.5s ease-out 0.18s both;
      }
      /* Thin bar sliding back and forth: loading, no fixed length. */
      .splash__bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(31, 58, 95, 0.1);
        animation: splash-rise 0.4s ease-out 0.3s both;
      }
      .splash__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #1fa5d6, #f59a3c, #d6337a);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-slide {
        from { left: -40%; }
        to { left: 100%; }
      }
      /* "Reduce motion" setting: no movement, just a quick fade. */
      @media (prefers-reduced-motion: reduce) {
        .splash__mark, .splash__name, .splash__bar, .splash__bar::after {
          animation: none;
        }
        .splash__bar::after { left: 30%; }
      }
    </style>
  </head>
  <body>
    <!-- Animated loading screen; main.tsx fades it out once the boards are loaded. -->
    <div id="splash" role="status" aria-label="Loading board">
      <div class="splash__logo">
        <img class="splash__mark" src="/logo-mark.png" alt="" />
        <span class="splash__name">Niro</span>
      </div>
      <div class="splash__bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
